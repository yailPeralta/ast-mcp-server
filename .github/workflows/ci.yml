name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node scripts/ci-prepare-gnu-mv.mjs prepare
      - run: NODE_OPTIONS= corepack enable
      - run: NODE_OPTIONS= yarn install --immutable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: NODE_OPTIONS= corepack enable
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn test:mcp
      - run: yarn test:errors
      - run: yarn test:lifecycle
      - run: yarn test:cli
      - run: yarn test:package
      - run: yarn audit
      - run: yarn pack --dry-run --json
      - run: node scripts/workflow-policy-check.mjs
      - run: git diff --check HEAD^ HEAD
