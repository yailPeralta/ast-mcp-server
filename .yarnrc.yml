nodeLinker: node-modules
enableScripts: false
enableTelemetry: false
# Every 18.x and 19.x release of @angular/compiler and @angular/core carries open advisories
# (browser sanitizer and i18n code) with no later patch on either branch. They are installed only by
# the dev-only angular-compiler-v18/v19 test aliases and the private test/angular-matrix workspaces,
# never as a runtime dependency of the published package. The audit reports aliases under the real
# package name. test/dependency-policy.test.ts pins this exclusion to that exact shape.
npmAuditExcludePackages:
  - "@angular/compiler"
  - "@angular/core"
# GHSA-fc5q-39xc-vjpf (picomatch ReDoS) affects every picomatch release (<=4.0.7) and has no patch.
# picomatch reaches the runtime only through @ts-morph/common -> tinyglobby, which matches the
# analyzed project's tsconfig include patterns; no MCP tool input becomes a glob. Only this advisory
# is ignored, not the package. Yarn matches the npm advisory ID (1247710), not the GHSA ID.
# Remove it once a patched picomatch ships (#497).
# test/dependency-policy.test.ts pins this exact shape.
npmAuditIgnoreAdvisories:
  - "1247710"
