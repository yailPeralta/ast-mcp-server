nodeLinker: node-modules
enableScripts: false
enableTelemetry: false
# Every 18.x and 19.x release of @angular/compiler and @angular/core carries open advisories
# (browser sanitizer and i18n code) with no later patch on either branch. They are installed only by
# the dev-only angular-compiler-v18/v19 test aliases and the private test/angular-matrix workspaces,
# never as a runtime dependency of the published package. The audit reports aliases under the real
# package name. test/dependency-policy.test.ts pins this exclusion to that exact shape.
npmAuditExcludePackages:
  - "@angular/compiler"
  - "@angular/core"
