nodeLinker: node-modules
enableScripts: false
enableTelemetry: false
# @angular/compiler is never a dependency: only the dev-only angular-compiler-v18/v19 test
# aliases resolve to it, and every 18.x/19.x release carries open browser-sanitizer advisories.
# test/dependency-policy.test.ts pins this exclusion to that exact shape.
npmAuditExcludePackages:
  - "@angular/compiler"
